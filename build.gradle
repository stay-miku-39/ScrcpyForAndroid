buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.0'
    }
}

apply plugin: 'com.android.application'

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-Xlint:deprecation'
    }
}

android {
    namespace 'org.scrcpy.android'
    compileSdk = (project.findProperty('androidCompileSdk') ?: '36').toInteger()
    defaultConfig {
        applicationId 'org.scrcpy.android'
        minSdk 30
        targetSdk 36
        versionCode 5
        versionName '0.4.1'
        testInstrumentationRunner 'org.scrcpy.android.SmokeInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures { buildConfig true }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/serverAssets').get().asFile)
    packaging.resources.excludes += ['META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA']
}

// Always package the matching server built from this checkout, never download a
// different release or rely on a separately installed desktop scrcpy.
def serverApk = project(':server').layout.buildDirectory.file('outputs/apk/debug/server-debug.apk')
def inputServerApk = project(':input-server').layout.buildDirectory.file('outputs/apk/debug/input-server-debug.apk')
tasks.register('bundleScrcpyServer', Copy) {
    dependsOn ':server:assembleDebug', ':input-server:assembleDebug'
    from(serverApk) { rename { 'scrcpy-server.jar' } }
    from(inputServerApk) { rename { 'scrcpy-input-server.jar' } }
    into layout.buildDirectory.dir('generated/serverAssets')
}
tasks.named('preBuild').configure { dependsOn 'bundleScrcpyServer' }

dependencies {
    implementation project(':adb-library')
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.84'
    testImplementation 'junit:junit:4.13.2'
}
